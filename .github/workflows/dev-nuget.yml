name: Dev NuGet build

# Builds dev/test artifacts from the Dev branch on every push and publishes them as GitHub Release
# assets -- no NuGet feed (GitHub Packages or otherwise) is involved, so there's nothing for
# testers to authenticate against. Two releases are published on every run:
#   - a dated release (tag `dev-<run number>-<short sha>`), kept forever, so a specific past dev
#     build can be pinned to or re-downloaded (e.g. to match what a tester reported a bug against).
#   - the rolling `dev-latest` release, whose tag and assets are overwritten every run, so the
#     README can link to one permanent URL that always has the newest build.
#
# Two jobs produce five assets on each release: three individual packages, the Bridge.Host zip, and
# one combined "everything" bundle for anyone who'd rather have a single download.
#   - pack_nuget (ubuntu-latest): Helios.Client + Helios.Bridge.Contracts as .nupkg files (the .NET 8
#     bridge client). Packs the two .csproj files directly (not Helios.sln), so it never touches the
#     net48/IAPI side of the build and needs nothing beyond the .NET 8 SDK.
#   - build-bridge-host (windows-latest, needs pack_nuget for the shared version/tag): builds the
#     net48 side -- Helios.Bridge.Host (zipped) for the bridge path, and the original Helios package
#     (.nupkg, via the classic nuget.exe CLI against Helios.csproj/Helios.nuspec -- old-style
#     project, no dotnet pack support) for legacy in-process consumers who link Helios.dll directly.
#     Both need the sibling `iapi` repo (private HintPaths) and Nova (no public NuGet feed) to build
#     -- this job fetches both fresh from their own public GitHub homes instead
#     (thermofisherlsms/iapi, MIT; SchweppeLab/Nova's own released nupkg), so no self-hosted runner
#     or private feed access is needed. Helios can't redistribute Thermo's IAPI DLLs, so this job
#     strips the specific files Helios.csproj's HintPaths pull into Helios.Bridge.Host's build output
#     before zipping it (nuget.exe's own convention-based packing already excludes them from the
#     Helios package without any stripping needed -- verified locally), and drops in a README telling
#     testers which files to supply themselves from their own licensed IAPI install; the original
#     Helios package needs the same files added to a consumer's own project references. This job also
#     assembles the combined bundle from its own output plus pack_nuget's (handed across via workflow
#     artifacts, since the two jobs run on separate runners). ScanInjector and ScanSpy aren't
#     built/published here -- they're demo apps, not something a consuming tester's own application
#     needs.

on:
  push:
    branches: [Dev]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pack_nuget:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute dev package version
        id: version
        run: |
          short_sha=$(git rev-parse --short HEAD)
          echo "version=0.1.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${{ github.run_number }}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      # Bridge.Contracts first: Helios.Client references it via ProjectReference, and the
      # PackageVersion override below applies to both, so Client's generated dependency on
      # Contracts resolves to the matching version automatically.
      - name: Pack Helios.Bridge.Contracts and Helios.Client
        run: |
          dotnet pack Bridge/Helios.Bridge.Contracts/Helios.Bridge.Contracts.csproj \
            -c Release -o pack-out -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack Bridge/Helios.Client/Helios.Client.csproj \
            -c Release -o pack-out -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Duplicate packages under version-free filenames for the rolling release
        run: |
          mkdir -p pack-out-latest
          cp pack-out/Helios.Bridge.Contracts.*.nupkg pack-out-latest/Helios.Bridge.Contracts-dev-latest.nupkg
          cp pack-out/Helios.Client.*.nupkg pack-out-latest/Helios.Client-dev-latest.nupkg

      # Hand-off to build-bridge-host, which assembles the single combined "everything" zip -- it
      # runs on a separate windows-latest runner, so it can't just read this job's local disk.
      - name: Upload packed NuGet packages for the combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: nuget-versioned
          path: pack-out/*.nupkg
          retention-days: 7

      - name: Upload version-free NuGet packages for the combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: nuget-latest
          path: pack-out-latest/*.nupkg
          retention-days: 7

      - name: Publish dated dev release (history)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dev build ${{ steps.version.outputs.version }}"
          body: |
            Automated development build from `Dev` @ ${{ steps.version.outputs.short_sha }}.
            Not a stable release -- the API may change without notice. See `HISTORY.md` on the
            `Dev` branch for what's in this build. This workflow's second job adds the original
            Helios package, the Helios.Bridge.Host zip, and a combined bundle with everything in one
            download, alongside these NuGet packages.
          prerelease: true
          make_latest: "false"
          files: pack-out/*.nupkg

      # softprops/action-gh-release updates an existing release/re-uploads matching-named assets
      # for a tag it's already seen, but it does not move a pre-existing git tag to a new commit --
      # without this, dev-latest's *tag* would keep pointing at the very first build forever even
      # though its release assets stay fresh. Force-move it ourselves before publishing.
      - name: Move the dev-latest tag to this commit
        run: |
          git tag -f dev-latest
          git push origin dev-latest --force

      - name: Publish rolling dev-latest release (always-fresh link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Latest dev build"
          body: |
            Always the most recent successful build from `Dev` (currently
            ${{ steps.version.outputs.version }}, @ ${{ steps.version.outputs.short_sha }}).
            Assets here are overwritten on every push -- see the
            [Releases page](https://github.com/SchweppeLab/Helios/releases) to pin a specific past
            build instead.
          prerelease: true
          make_latest: "false"
          files: pack-out-latest/*.nupkg

  build-bridge-host:
    needs: pack_nuget
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Sibling of the checkout, matching Helios.csproj's `..\..\iapi\...` HintPaths. Public/MIT;
      # its lib/ layout matches those HintPaths file-for-file (verified locally before adding this
      # job) -- this is build-time only, never shipped (see the strip step below).
      - name: Clone iapi (build-time only, never redistributed)
        run: git clone --depth 1 https://github.com/thermofisherlsms/iapi ../iapi

      # TEMPORARY: pinned to a Nova Dev-branch dev build, not a stable release -- Nova's core
      # package moved to netstandard2.0 there (no net48 build exists anymore), and Helios is
      # riding that ahead of a real Nova release. Swap this whole step back to a tagged Nova
      # release once one ships.
      #
      # Nova's own dev-latest release keeps per-run *versioned* asset filenames (not fixed
      # version-free ones), so this pins directly to today's known-good build rather than
      # whatever dev-latest happens to be at CI run time -- that would silently drift whenever
      # Nova's Dev branch moves forward again.
      #
      # Keeps the raw Nova.1.1.0-dev.8.nupkg file itself inside the packages/Nova.1.1.0-dev.8/
      # folder, not just its extracted contents -- nuget.exe pack's packages.config-driven
      # dependency resolution (used below, for the original Helios package) needs that exact file
      # to satisfy the Nova dependency it declares, and fails with NU5012 ("Unable to find
      # 'Nova.1.1.0-dev.8.nupkg'") without it. Found live with the previous pinned version: this
      # only worked locally by accident, because this machine's global NuGet cache and a
      # machine-level NuGet.Config both happen to already have Nova cached/configured from
      # unrelated past work -- neither exists on a fresh CI runner. Reproduced and confirmed the
      # fix in a fully isolated local test (NUGET_PACKAGES redirected to an empty folder,
      # NuGet.Config sources cleared) before landing this.
      - name: Fetch Nova into the local packages layout
        run: |
          Invoke-WebRequest -Uri "https://github.com/SchweppeLab/Nova/releases/download/dev-latest/Nova.1.1.0-dev.8.nupkg" -OutFile "Nova.1.1.0-dev.8.nupkg"
          New-Item -ItemType Directory -Force -Path "Helios/packages/Nova.1.1.0-dev.8" | Out-Null
          Expand-Archive -Path "Nova.1.1.0-dev.8.nupkg" -DestinationPath "Helios/packages/Nova.1.1.0-dev.8" -Force
          Copy-Item "Nova.1.1.0-dev.8.nupkg" "Helios/packages/Nova.1.1.0-dev.8/Nova.1.1.0-dev.8.nupkg"

      - name: Build Helios.Bridge.Host
        run: dotnet build Bridge/Helios.Bridge.Host/Helios.Bridge.Host.csproj -c Release -p:Platform=x64

      # The original in-process Helios package (Helios.dll itself), for legacy net48 consumers that
      # link Helios directly rather than going through the bridge. Helios.csproj is old-style (no
      # dotnet pack support), so this uses the classic nuget.exe CLI against its pre-existing
      # Helios.nuspec instead -- verified locally that this correctly grabs only Helios.dll/
      # Helios.xml from the build output, ignoring the IAPI/Nova DLLs CopyLocal'd into that same bin
      # folder (nuget.exe's convention-based packing only bundles a project's own primary output).
      - name: Fetch the classic nuget.exe CLI
        run: Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile nuget.exe

      # Reads Helios's version from AssemblyInfo.cs rather than hardcoding it here, so this stays
      # correct whenever Helios's own version is bumped, with no workflow edit needed to match.
      - name: Pack the original Helios package
        run: |
          $assemblyInfo = Get-Content "Helios/Properties/AssemblyInfo.cs" -Raw
          if ($assemblyInfo -notmatch 'AssemblyVersion\("([^"]+)"\)') {
            throw "Could not find AssemblyVersion in Helios/Properties/AssemblyInfo.cs"
          }
          $heliosVersion = "$($matches[1])-dev.${{ github.run_number }}"

          .\nuget.exe pack Helios/Helios.csproj -OutputDirectory helios-pack-out -Properties "Configuration=Release;Platform=x64" -Version $heliosVersion
          if ($LASTEXITCODE -ne 0) {
            throw "nuget.exe pack failed with exit code $LASTEXITCODE"
          }

          New-Item -ItemType Directory -Force -Path helios-pack-out-latest | Out-Null
          Copy-Item "helios-pack-out/Helios.$heliosVersion.nupkg" "helios-pack-out-latest/Helios-dev-latest.nupkg"

      - name: Attach original Helios package to the dated dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.pack_nuget.outputs.tag }}
          prerelease: true
          make_latest: "false"
          files: helios-pack-out/*.nupkg

      - name: Attach original Helios package to the rolling dev-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          prerelease: true
          make_latest: "false"
          files: helios-pack-out-latest/*.nupkg

      # Helios can't redistribute Thermo's IAPI DLLs. This is the exact set Helios.csproj's
      # HintPaths pull into the build output (confirmed against a real local build) -- Helios.dll
      # and Nova.dll themselves are SchweppeLab's own and stay.
      - name: Strip IAPI DLLs from the build output
        run: |
          $outDir = "Bridge/Helios.Bridge.Host/bin/x64/Release/net48"
          $iapiFiles = @(
            "API-2.0.dll","API-2.0.xml",
            "Fusion.API-2.0.dll",
            "Spectrum-1.0.dll","Spectrum-1.0.xml",
            "Thermo.API.Exploris.NetStd-1.0.dll","Thermo.API.Exploris.NetStd-1.0.xml",
            "Thermo.API.NetStd-1.0.dll","Thermo.API.NetStd-1.0.xml",
            "Thermo.API.Spectrum.NetStd-1.0.dll","Thermo.API.Spectrum.NetStd-1.0.xml",
            "Thermo.TNG.Factory.dll","Thermo.TNG.Factory.xml"
          )
          foreach ($f in $iapiFiles) {
            Remove-Item -Path (Join-Path $outDir $f) -ErrorAction SilentlyContinue
          }
          @"
          This build of Helios.Bridge.Host does not include Thermo Fisher Scientific's IAPI DLLs --
          Helios can't redistribute them. To run against a real Fusion/Exploris instrument, copy
          these files from your own licensed IAPI installation into this same folder, next to
          Helios.Bridge.Host.exe:

            API-2.0.dll
            Fusion.API-2.0.dll
            Spectrum-1.0.dll
            Thermo.API.Exploris.NetStd-1.0.dll
            Thermo.API.NetStd-1.0.dll
            Thermo.API.Spectrum.NetStd-1.0.dll
            Thermo.TNG.Factory.dll

          Without them, Helios.Bridge.Host still runs fine against the built-in Simulated backend
          (see App.config's InstrumentFamily key) or a Corona/VMS connection -- neither needs IAPI.
          "@ | Out-File -FilePath (Join-Path $outDir "README-IAPI.txt") -Encoding utf8

      - name: Zip the build output
        run: |
          $outDir = "Bridge/Helios.Bridge.Host/bin/x64/Release/net48"
          Compress-Archive -Path "$outDir/*" -DestinationPath "Helios.Bridge.Host.${{ needs.pack_nuget.outputs.version }}.zip" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "Helios.Bridge.Host-dev-latest.zip" -Force

      - name: Attach to the dated dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.pack_nuget.outputs.tag }}
          prerelease: true
          make_latest: "false"
          files: Helios.Bridge.Host.${{ needs.pack_nuget.outputs.version }}.zip

      - name: Attach to the rolling dev-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          prerelease: true
          make_latest: "false"
          files: Helios.Bridge.Host-dev-latest.zip

      - name: Download NuGet packages built by pack_nuget
        uses: actions/download-artifact@v4
        with:
          name: nuget-versioned
          path: nuget-versioned

      - uses: actions/download-artifact@v4
        with:
          name: nuget-latest
          path: nuget-latest

      # Same treatment as the NuGet packages above: fold the original Helios package into the same
      # source folders the combined bundle reads from, so New-Bundle below picks it up without
      # needing its own separate copy logic.
      - name: Add the original Helios package into the bundle inputs
        run: |
          Copy-Item helios-pack-out/*.nupkg nuget-versioned/
          Copy-Item helios-pack-out-latest/*.nupkg nuget-latest/

      # One archive with everything a tester needs, so a single download is enough: all three NuGet
      # packages plus the Bridge.Host build, laid out so the top-level README walks straight into
      # both setup steps. The individual assets above stay too, for anyone who only wants one piece
      # (e.g. just Helios.Client, because they already have a Bridge.Host running elsewhere).
      - name: Assemble the combined bundle
        run: |
          $outDir = "Bridge/Helios.Bridge.Host/bin/x64/Release/net48"
          $readmeLines = @(
            "Helios dev build -- everything in one place",
            "=============================================",
            "",
            "NuGet/",
            "  Helios.Client*.nupkg              .NET 8 client library, talks to Helios.Bridge.Host",
            "  Helios.Bridge.Contracts*.nupkg    shared gRPC contract (Helios.Client's dependency)",
            "  Helios*.nupkg                     original net48 in-process library -- link Helios.dll",
            "                                     directly instead of going through the bridge; needs",
            "                                     the same IAPI DLLs as Helios.Bridge.Host, added to",
            "                                     your own project's references",
            "",
            "Helios.Bridge.Host/",
            "  Helios.Bridge.Host.exe            the bridge host process -- run once with --register,",
            "                                     or just let HeliosClient.ConnectAsync auto-launch it",
            "  README-IAPI.txt                   which files to supply yourself for real hardware",
            "",
            "Setup:",
            "  1. dotnet nuget add source <path to this bundle's NuGet folder> -n HeliosDev",
            "     then reference Helios.Client (bridge) or Helios (in-process) from your own project",
            "     as usual. Only pull in one of the two -- they're alternative ways to use Helios, not",
            "     a matched pair.",
            "  2. Keep Helios.Bridge.Host/ wherever you like. See its own README-IAPI.txt before",
            "     connecting to real Fusion/Exploris hardware -- it runs fine without that against",
            "     the built-in Simulated backend or a Corona/VMS connection. The same IAPI files are",
            "     needed if you're using the Helios*.nupkg in-process package instead.",
            "",
            "Pre-release, unsupported development build. Full README/HISTORY.md:",
            "https://github.com/SchweppeLab/Helios/tree/Dev"
          )

          function New-Bundle($bundleDir, $nugetDir, $zipPath) {
            New-Item -ItemType Directory -Force -Path "$bundleDir/NuGet" | Out-Null
            New-Item -ItemType Directory -Force -Path "$bundleDir/Helios.Bridge.Host" | Out-Null
            Copy-Item "$nugetDir/*.nupkg" "$bundleDir/NuGet/"
            Copy-Item "$outDir/*" "$bundleDir/Helios.Bridge.Host/" -Recurse
            $readmeLines | Out-File -FilePath "$bundleDir/README.txt" -Encoding utf8
            Compress-Archive -Path "$bundleDir/*" -DestinationPath $zipPath -Force
          }

          New-Bundle "bundle-dated" "nuget-versioned" "Helios.${{ needs.pack_nuget.outputs.version }}.zip"
          New-Bundle "bundle-latest" "nuget-latest" "Helios-dev-latest.zip"

      - name: Attach combined bundle to the dated dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.pack_nuget.outputs.tag }}
          prerelease: true
          make_latest: "false"
          files: Helios.${{ needs.pack_nuget.outputs.version }}.zip

      - name: Attach combined bundle to the rolling dev-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          prerelease: true
          make_latest: "false"
          files: Helios-dev-latest.zip
