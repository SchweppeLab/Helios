syntax = "proto3";

package helios.bridge.v1;

import "common.proto";

option csharp_namespace = "Helios.Bridge.Contracts";

// Acquisition control, custom/repeating scan submission, and the events that come back from them.
service InstrumentControlService {
  rpc SetAcquisitionMode(SetAcquisitionModeRequest) returns (Empty);
  rpc StartAcquisition(StartAcquisitionRequest) returns (Empty);
  rpc CancelAcquisition(Empty) returns (Empty);
  rpc StreamAcquisitionState(Empty) returns (stream AcquisitionStateEvent);

  rpc GetPossibleScanParameters(GetPossibleScanParametersRequest) returns (ScanParametersResponse);

  rpc SubmitCustomScan(CustomScanRequest) returns (SubmitScanResponse);
  rpc SubmitRepeatingScan(RepeatingScanRequest) returns (SubmitScanResponse);
  rpc CancelCustomScan(Empty) returns (SubmitScanResponse);
  rpc CancelRepetition(Empty) returns (SubmitScanResponse);

  rpc StreamScanControlEvents(Empty) returns (stream ScanControlEvent);

  rpc GetInstrumentValues(GetInstrumentValuesRequest) returns (InstrumentValuesResponse);
}

enum AcquisitionModeKind {
  ACQUISITION_MODE_UNSPECIFIED = 0;
  MODE_ON = 1;
  MODE_OFF = 2;
}

message SetAcquisitionModeRequest {
  AcquisitionModeKind mode = 1;
}

message StartAcquisitionRequest {
  string raw_file_name = 1;
  string comment = 2;
  double single_processing_delay = 3;
  bool wait_for_contact_closure = 4;

  oneof workflow {
    PermanentWorkflow permanent = 5;
    CountLimitedWorkflow count_limited = 6;
    DurationLimitedWorkflow duration_limited = 7;
    MethodWorkflow method = 8;
  }
}

message PermanentWorkflow {
}

message CountLimitedWorkflow {
  int32 scan_count = 1;
}

message DurationLimitedWorkflow {
  int64 duration_ms = 1;
}

message MethodWorkflow {
  string method_file_name = 1;
}

message AcquisitionStateEvent {
  oneof event {
    StateChangedEvent state_changed = 1;
    AcquisitionStreamOpeningEvent stream_opening = 2;
    AcquisitionStreamClosingEvent stream_closing = 3;
  }
}

message StateChangedEvent {
  SystemMode system_mode = 1;
  InstrumentState system_state = 2;
}

message AcquisitionStreamOpeningEvent {
  map<string, string> starting_information = 1;
}

message AcquisitionStreamClosingEvent {
}

message GetPossibleScanParametersRequest {
  bool exclusive_access = 1;
}

message ScanParametersResponse {
  repeated ScanParameterDescriptor parameters = 1;
}

message CustomScanRequest {
  int64 running_number = 1;
  double single_processing_delay = 2;
  map<string, string> values = 3;
  bool is_pagc_scan = 4;      // Fusion-only; ignored when connected to Exploris.
  int64 pagc_group_index = 5; // Fusion-only; ignored when connected to Exploris.
}

message RepeatingScanRequest {
  int64 running_number = 1;
  map<string, string> values = 2;
}

message SubmitScanResponse {
  bool accepted = 1;
}

message ScanControlEvent {
  oneof event {
    CanAcceptNextCustomScanEvent can_accept_next = 1;
    PossibleParametersChangedEvent possible_parameters_changed = 2;
    NumOpenCustomScanSlotsEvent num_open_slots = 3;
  }
}

message CanAcceptNextCustomScanEvent {
}

message PossibleParametersChangedEvent {
  repeated ScanParameterDescriptor parameters = 1;
}

message NumOpenCustomScanSlotsEvent {
  int32 num_open_slots = 1;
}

message GetInstrumentValuesRequest {
  repeated string names = 1; // Empty = all known ValueNames.
}

message InstrumentValuesResponse {
  map<string, string> values = 1;
}
